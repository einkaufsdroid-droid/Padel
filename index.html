
<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Padel & Tennis Zähler</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #121212;
            color: white;
            text-align: center;
            margin: 0;
            padding: 20px;
        }
        .container {
            max-width: 800px;
            margin: 0 auto;
            position: relative;
            padding-bottom: 80px;
        }
        .card {
            background-color: #1e1e1e;
            padding: 20px;
            border-radius: 12px;
            margin-bottom: 20px;
            box-shadow: 0 4px 10px rgba(0,0,0,0.5);
        }
        input, select, button {
            padding: 10px;
            margin: 5px;
            border-radius: 6px;
            border: none;
            font-size: 16px;
        }
        button {
            background-color: #ffcc00;
            color: black;
            font-weight: bold;
            cursor: pointer;
        }
        button:hover { background-color: #e6b800; }
        .score-board {
            display: flex;
            justify-content: space-around;
            align-items: center;
        }
        .team { width: 45%; }
        .score {
            font-size: 64px;
            font-weight: bold;
            color: #ffcc00;
            margin: 10px 0;
        }
        .ball {
            display: inline-block;
            width: 15px;
            height: 15px;
            background-color: #ccff00;
            border-radius: 50%;
            margin: 2px;
            box-shadow: 0 0 5px #ccff00;
        }
        #voice-btn {
            background-color: #00cc66;
            color: white;
            padding: 12px 20px;
            font-size: 18px;
        }
        #reset-btn {
            position: fixed;
            bottom: 20px;
            right: 20px;
            background-color: #ff3333;
            color: white;
            padding: 12px 20px;
            border-radius: 8px;
        }
    </style>
</head>
<body>

<div class="container">
    <h1>Padel Score Tracker</h1>

    <!-- Setup Formular -->
    <div id="setup" class="card">
        <h2>Spiel-Einstellungen</h2>
        <div>
            <h3>Team 1</h3>
            <input type="text" id="t1-name" value="Team 1"><br>
            <input type="text" id="t1-p1" placeholder="Spieler 1">
            <input type="text" id="t1-p2" placeholder="Spieler 2">
        </div>
        <hr style="border-color: #333; margin: 15px 0;">
        <div>
            <h3>Team 2</h3>
            <input type="text" id="t2-name" value="Team 2"><br>
            <input type="text" id="t2-p1" placeholder="Spieler 1">
            <input type="text" id="t2-p2" placeholder="Spieler 2">
        </div>
        <hr style="border-color: #333; margin: 15px 0;">
        <label for="sets-select">Anzahl Gewinnsätze: </label>
        <select id="sets-select">
            <option value="1">1 Gewinnsatz</option>
            <option value="2" selected>Best of 3 (2 Gewinnsätze)</option>
            <option value="3">Best of 5 (3 Gewinnsätze)</option>
        </select><br><br>
        <button onclick="startGame()">Spiel starten</button>
    </div>

    <!-- Live Scoreboard -->
    <div id="scoreboard" class="card" style="display: none;">
        <button id="voice-btn" onclick="toggleVoice()">🎤 Sprachsteuerung starten</button>
        <p id="voice-status" style="font-size: 12px; color: #888;">Befehle: "Team 1 Punkt", "Team 2 Punkt", "Team 1 minus Punkt", "Team 2 minus Punkt"</p>
        
        <div class="score-board">
            <div class="team">
                <h2 id="disp-t1-name">Team 1</h2>
                <p id="disp-t1-players" style="color: #aaa; font-size: 14px;"></p>
                <div id="score1" class="score">0</div>
                <div>Spiele im Satz: <span id="games1">0</span></div>
                <div>Gewonnene Sätze: <span id="sets1">0</span></div>
                <div id="balls1" style="margin-top: 10px;"></div>
            </div>
            
            <div class="team">
                <h2 id="disp-t2-name">Team 2</h2>
                <p id="disp-t2-players" style="color: #aaa; font-size: 14px;"></p>
                <div id="score2" class="score">0</div>
                <div>Spiele im Satz: <span id="games2">0</span></div>
                <div>Gewonnene Sätze: <span id="sets2">0</span></div>
                <div id="balls2" style="margin-top: 10px;"></div>
            </div>
        </div>
    </div>

    <!-- Match Statistik -->
    <div id="stats" class="card" style="display: none;">
        <h2>Match Beendet!</h2>
        <h3 id="winner-text" style="color: #ffcc00;"></h3>
        <hr style="border-color: #333;">
        <h3>Endstatistik</h3>
        <p id="stat-sets"></p>
        <p id="stat-games"></p>
    </div>
</div>

<button id="reset-btn" onclick="resetGame()">Reset</button>

<script>
    let state = {
        t1Name: "Team 1", t2Name: "Team 2",
        t1Players: "", t2Players: "",
        targetSets: 2,
        p1: 0, p2: 0, // 0=0, 1=15, 2=30, 3=40, 4=Vorteil
        games1: 0, games2: 0,
        sets1: 0, sets2: 0,
        totalGames1: 0, totalGames2: 0,
        history: [],
        gameOver: false
    };

    const pointsMap = ["0", "15", "30", "40", "Vorteil"];
    let recognition = null;
    let isListening = false;

    function startGame() {
        state.t1Name = document.getElementById('t1-name').value || "Team 1";
        state.t2Name = document.getElementById('t2-name').value || "Team 2";
        
        let p1_1 = document.getElementById('t1-p1').value;
        let p1_2 = document.getElementById('t1-p2').value;
        state.t1Players = [p1_1, p1_2].filter(Boolean).join(" & ");

        let p2_1 = document.getElementById('t2-p1').value;
        let p2_2 = document.getElementById('t2-p2').value;
        state.t2Players = [p2_1, p2_2].filter(Boolean).join(" & ");

        state.targetSets = parseInt(document.getElementById('sets-select').value);

        document.getElementById('disp-t1-name').innerText = state.t1Name;
        document.getElementById('disp-t1-players').innerText = state.t1Players;
        document.getElementById('disp-t2-name').innerText = state.t2Name;
        document.getElementById('disp-t2-players').innerText = state.t2Players;

        document.getElementById('setup').style.display = 'none';
        document.getElementById('scoreboard').style.display = 'block';
        
        initSpeech();
        updateDisplay();
    }

    function addPoint(team) {
        if (state.gameOver) return;
        saveState();

        if (team === 1) {
            if (state.p1 === 3 && state.p2 === 3) state.p1 = 4; // Vorteil T1
            else if (state.p1 === 3 && state.p2 === 4) state.p2 = 3; // Gleichstand
            else if (state.p1 === 4 || (state.p1 === 3 && state.p2 < 3)) winGame(1);
            else state.p1++;
        } else {
            if (state.p1 === 3 && state.p2 === 3) state.p2 = 4; // Vorteil T2
            else if (state.p2 === 3 && state.p1 === 4) state.p1 = 3; // Gleichstand
            else if (state.p2 === 4 || (state.p2 === 3 && state.p1 < 3)) winGame(2);
            else state.p2++;
        }
        updateDisplay();
    }

    function removePoint(team) {
        if (state.history.length > 0) {
            let lastState = state.history.pop();
            // Nur Punktezustand wiederherstellen
            state.p1 = lastState.p1;
            state.p2 = lastState.p2;
            state.games1 = lastState.games1;
            state.games2 = lastState.games2;
            state.sets1 = lastState.sets1;
            state.sets2 = lastState.sets2;
            state.totalGames1 = lastState.totalGames1;
            state.totalGames2 = lastState.totalGames2;
            state.gameOver = false;
            document.getElementById('stats').style.display = 'none';
            updateDisplay();
        }
    }

    function winGame(team) {
        state.p1 = 0;
        state.p2 = 0;
        if (team === 1) {
            state.games1++;
            state.totalGames1++;
        } else {
            state.games2++;
            state.totalGames2++;
        }

        // Satz-Logik (mind. 6 Spiele & 2 Spiele Vorsprung)
        if (state.games1 >= 6 && state.games1 - state.games2 >= 2) {
            state.sets1++;
            state.games1 = 0;
            state.games2 = 0;
        } else if (state.games2 >= 6 && state.games2 - state.games1 >= 2) {
            state.sets2++;
            state.games1 = 0;
            state.games2 = 0;
        }

        // Match-Logik
        if (state.sets1 === state.targetSets || state.sets2 === state.targetSets) {
            state.gameOver = true;
            showStats();
        }
    }

    function saveState() {
        state.history.push(JSON.parse(JSON.stringify(state)));
    }

    function updateDisplay() {
        // Punkte Anzeige
        if (state.p1 === 3 && state.p2 === 3) {
            document.getElementById('score1').innerText = "40";
            document.getElementById('score2').innerText = "40";
        } else {
            document.getElementById('score1').innerText = pointsMap[state.p1];
            document.getElementById('score2').innerText = pointsMap[state.p2];
        }

        document.getElementById('games1').innerText = state.games1;
        document.getElementById('games2').innerText = state.games2;
        document.getElementById('sets1').innerText = state.sets1;
        document.getElementById('sets2').innerText = state.sets2;

        // Tennisbälle zeichnen
        renderBalls('balls1', state.totalGames1);
        renderBalls('balls2', state.totalGames2);
    }

    function renderBalls(containerId, count) {
        const container = document.getElementById(containerId);
        container.innerHTML = '';
        for (let i = 0; i < count; i++) {
            let ball = document.createElement('span');
            ball.className = 'ball';
            container.appendChild(ball);
        }
    }

    function showStats() {
        document.getElementById('stats').style.display = 'block';
        let winner = state.sets1 > state.sets2 ? state.t1Name : state.t2Name;
        document.getElementById('winner-text').innerText = "Sieger: " + winner;
        document.getElementById('stat-sets').innerText = `Endstand Sätze: ${state.t1Name} ${state.sets1} : ${state.sets2} ${state.t2Name}`;
        document.getElementById('stat-games').innerText = `Gesamt gewonnene Spiele: ${state.t1Name} (${state.totalGames1}) - ${state.t2Name} (${state.totalGames2})`;
    }

    function resetGame() {
        state = {
            t1Name: "Team 1", t2Name: "Team 2", t1Players: "", t2Players: "",
            targetSets: 2, p1: 0, p2: 0, games1: 0, games2: 0,
            sets1: 0, sets2: 0, totalGames1: 0, totalGames2: 0,
            history: [], gameOver: false
        };
        document.getElementById('setup').style.display = 'block';
        document.getElementById('scoreboard').style.display = 'none';
        document.getElementById('stats').style.display = 'none';
    }

    // Sprachsteuerung
    function initSpeech() {
        if ('webkitSpeechRecognition' in window || 'SpeechRecognition' in window) {
            const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
            recognition = new SpeechRecognition();
            recognition.continuous = true;
            recognition.lang = 'de-DE';

            recognition.onresult = function(event) {
                let last = event.results.length - 1;
                let text = event.results[last][0].transcript.trim().toLowerCase();
                
                if (text.includes("team 1 minus punkt") || text.includes("team 1 - punkt")) {
                    removePoint(1);
                } else if (text.includes("team 2 minus punkt") || text.includes("team 2 - punkt")) {
                    removePoint(2);
                } else if (text.includes("team 1 punkt")) {
                    addPoint(1);
                } else if (text.includes("team 2 punkt")) {
                    addPoint(2);
                }
            };

            recognition.onend = function() {
                if (isListening) recognition.start(); // Neustart bei Unterbrechung
            };
        } else {
            document.getElementById('voice-btn').innerText = "Sprachsteuerung nicht unterstützt";
            document.getElementById('voice-btn').disabled = true;
        }
    }

    function toggleVoice() {
        if (!recognition) return;
        if (isListening) {
            recognition.stop();
            isListening = false;
            document.getElementById('voice-btn').innerText = "🎤 Sprachsteuerung starten";
            document.getElementById('voice-btn').style.backgroundColor = "#00cc66";
        } else {
            recognition.start();
            isListening = true;
            document.getElementById('voice-btn').innerText = "🛑 Sprachsteuerung stoppen";
            document.getElementById('voice-btn').style.backgroundColor = "#ff3333";
        }
    }
</script>

</body>
</html>
